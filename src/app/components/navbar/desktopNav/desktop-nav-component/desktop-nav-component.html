<div class="flex shrink-0 items-center">
  <nav class="flex items-center">
    <ul class="flex items-center gap-5 text-sm font-medium text-slate-700">
      <li>
        <button
          type="button"
          (click)="goToHome()"
          class="transition-colors duration-200 hover:text-orange-500"
        >
          Home
        </button>
      </li>

      <li>
        <button
          type="button"
          (click)="navigateToProducts()"
          class="transition-colors duration-200 hover:text-orange-500"
        >
          Shop
        </button>
      </li>

      <li>
        <button type="button" class="transition-colors duration-200 hover:text-orange-500">
          Deals
        </button>
      </li>

      <li>
        <button type="button" class="transition-colors duration-200 hover:text-orange-500">
          About
        </button>
      </li>

      <li>
        <button type="button" class="transition-colors duration-200 hover:text-orange-500">
          Contact
        </button>
      </li>
    </ul>

    <!-- Actions -->
    <ul class="ml-6 flex shrink-0 items-center gap-4 text-slate-700">
      <!-- Cart -->
      <li>
        <button
          type="button"
          (click)="goToCart()"
          class="relative flex h-9 w-9 items-center justify-center rounded-full transition hover:bg-orange-50 hover:text-orange-500"
          aria-label="Shopping cart"
        >
          <i class="fa-solid fa-cart-shopping text-base"></i>

          <span
            class="absolute -right-1 -top-1 flex h-5 min-w-5 items-center justify-center rounded-full bg-orange-500 px-1 text-[10px] font-bold text-white"
          >
            {{ cartService.cart().total_items }}
          </span>
        </button>
      </li>

      <!-- Account -->
      <li>
        <div class="relative" (mouseenter)="toggleDropdown()" (mouseleave)="toggleDropdown()">
          <button
            type="button"
            class="flex h-9 w-9 items-center justify-center rounded-full transition hover:bg-orange-50 hover:text-orange-500"
            aria-label="Account"
          >
            <i class="fa-regular fa-user text-base"></i>
          </button>

          <div
            [ngClass]="
              showDropdown
                ? 'absolute right-0 top-10 z-50 block w-40 rounded-xl border border-slate-200 bg-white p-2 shadow-xl'
                : 'hidden'
            "
          >
            <button
              type="button"
              (click)="goToAdminPage()"
              class="w-full rounded-lg px-3 py-2 text-left text-sm text-slate-700 transition hover:bg-orange-50 hover:text-orange-500"
            >
              Admin Actions
            </button>
          </div>
        </div>
      </li>
    </ul>
  </nav>
</div>
