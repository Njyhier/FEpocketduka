<div class="min-h-[60vh] flex flex-col items-center justify-center bg-slate-50">
  <!-- Spinner -->
  <div class="relative w-16 h-16">
    <div class="absolute inset-0 rounded-full border-4 border-slate-200"></div>

    <div
      class="absolute inset-0 rounded-full border-4 border-orange-400 border-t-transparent animate-spin"
    ></div>

    <!-- P logo -->
    <div class="absolute inset-2 rounded-full bg-slate-950 flex items-center justify-center">
      <span class="text-orange-400 font-black text-xl"> P </span>
    </div>
  </div>

  <!-- Text -->

  <div class="text-center mt-6">
    <p class="text-xl font-black text-slate-950">Pocket<span class="text-orange-500">Duka</span></p>

    <p class="text-sm text-slate-500 mt-1">Getting things ready for you...</p>
  </div>

  <!-- Loading dots -->

  <div class="flex items-center gap-1.5 mt-4">
    <span class="w-2 h-2 rounded-full bg-orange-400 animate-bounce"></span>

    <span class="w-2 h-2 rounded-full bg-orange-400 animate-bounce [animation-delay:150ms]"></span>

    <span class="w-2 h-2 rounded-full bg-orange-400 animate-bounce [animation-delay:300ms]"></span>
  </div>
</div>
