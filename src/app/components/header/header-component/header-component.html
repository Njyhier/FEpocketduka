<header
  class="sticky top-0 z-50 w-full border-b border-slate-200 bg-white/95 shadow-sm backdrop-blur-md"
>
  <div class="mx-auto w-full max-w-[1600px] sm:px-3 lg:px-4">
    <!-- Main Header Row -->
    <div class="flex min-w-0 items-center gap-3 py-3 lg:py-4">
      <!-- Logo -->
      <button
        type="button"
        (click)="navigateToProducts()"
        class="flex shrink-0 items-center gap-2"
        aria-label="PocketDuka"
      >
        <div
          class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-orange-500 to-orange-600 text-xl font-black text-white shadow-sm"
        >
          P
        </div>

        <div class="hidden sm:block">
          <h1 class="text-xl font-extrabold tracking-tight text-slate-900">
            Pocket<span class="text-orange-500">Duka</span>
          </h1>

          <p class="text-[10px] font-medium uppercase tracking-widest text-slate-400">Shop Smart</p>
        </div>
      </button>

      <!-- Desktop Search -->
      <div class="hidden min-w-0 flex-1 md:block">
        <div class="mx-auto flex w-full max-w-2xl">
          <div
            class="flex h-11 w-full min-w-0 items-center overflow-hidden rounded-xl border border-slate-200 bg-slate-50 transition focus-within:border-orange-400 focus-within:bg-white focus-within:ring-2 focus-within:ring-orange-100"
          >
            <input
              type="text"
              placeholder="Search for products..."
              class="min-w-0 flex-1 border-0 bg-transparent px-4 text-sm text-slate-700 outline-none placeholder:text-slate-400"
            />

            <button
              type="button"
              class="flex h-full w-12 shrink-0 items-center justify-center bg-orange-500 text-white transition hover:bg-orange-600"
              aria-label="Search"
            >
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Header Actions -->
      <div class="ml-auto flex shrink-0 items-center gap-2 sm:gap-4">
        <!-- Account -->
        <div class="relative hidden lg:block">
          <button
            type="button"
            (click)="toggleAccountMenu()"
            class="flex items-center gap-2 rounded-lg p-2 text-slate-600 transition hover:bg-slate-100 hover:text-orange-500"
            aria-label="Account menu"
            [attr.aria-expanded]="showAccountMenu()"
          >
            <i class="fa-regular fa-user text-xl"></i>

            <div class="text-left">
              <p class="text-[10px] text-slate-400">
                {{ isLoggedIn() ? 'Welcome back' : 'Welcome' }}
              </p>

              <p class="text-xs font-semibold text-slate-700">
                {{ isLoggedIn() ? currentUserName() : 'Account' }}
              </p>
            </div>

            <i
              class="fa-solid text-xs text-slate-400 transition-transform"
              [class.fa-chevron-up]="showAccountMenu()"
              [class.fa-chevron-down]="!showAccountMenu()"
            ></i>
          </button>

          <!-- Account Dropdown -->
          @if (showAccountMenu()) {
            <div
              class="absolute right-0 top-full z-50 mt-2 w-72 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl"
            >
              <!-- Logged In -->
              @if (isLoggedIn()) {
                <!-- User Info -->
                <div class="border-b border-slate-100 bg-slate-50 px-5 py-4">
                  <div class="flex items-center gap-3">
                    <div
                      class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-orange-100 text-orange-500"
                    >
                      <i class="fa-solid fa-user"></i>
                    </div>

                    <div class="min-w-0">
                      <p class="truncate text-sm font-bold text-slate-900">
                        {{ currentUserName() }}
                      </p>

                      <p class="truncate text-xs text-slate-400">
                        {{ currentUserEmail() }}
                      </p>
                    </div>
                  </div>
                </div>

                <!-- Account Options -->
                <div class="p-2">
                  <!-- My Account -->
                  <button
                    type="button"
                    (click)="navigateToAccount()"
                    class="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left text-sm font-medium text-slate-700 transition hover:bg-orange-50 hover:text-orange-500"
                  >
                    <span
                      class="flex h-9 w-9 items-center justify-center rounded-lg bg-slate-100 text-slate-500"
                    >
                      <i class="fa-regular fa-user"></i>
                    </span>

                    <span class="flex-1">
                      <span class="block font-semibold">My Account</span>
                      <span class="block text-xs text-slate-400"> Manage your profile </span>
                    </span>

                    <i class="fa-solid fa-chevron-right text-xs text-slate-300"></i>
                  </button>

                  <!-- My Orders -->
                  <button
                    type="button"
                    (click)="navigateToOrders()"
                    class="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left text-sm font-medium text-slate-700 transition hover:bg-orange-50 hover:text-orange-500"
                  >
                    <span
                      class="flex h-9 w-9 items-center justify-center rounded-lg bg-slate-100 text-slate-500"
                    >
                      <i class="fa-solid fa-box"></i>
                    </span>

                    <span class="flex-1">
                      <span class="block font-semibold">My Orders</span>
                      <span class="block text-xs text-slate-400"> Track your orders </span>
                    </span>

                    <i class="fa-solid fa-chevron-right text-xs text-slate-300"></i>
                  </button>

                  <!-- Wishlist -->
                  <button
                    type="button"
                    (click)="navigateToWishlist(); closeAccountMenu()"
                    class="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left text-sm font-medium text-slate-700 transition hover:bg-orange-50 hover:text-orange-500"
                  >
                    <span
                      class="flex h-9 w-9 items-center justify-center rounded-lg bg-slate-100 text-slate-500"
                    >
                      <i class="fa-regular fa-heart"></i>
                    </span>

                    <span class="flex-1">
                      <span class="block font-semibold">Wishlist</span>
                      <span class="block text-xs text-slate-400"> Your saved products </span>
                    </span>

                    <i class="fa-solid fa-chevron-right text-xs text-slate-300"></i>
                  </button>

                  <!-- Admin Panel -->
                  @if (isAdmin()) {
                    <button
                      type="button"
                      (click)="navigateToAdmin(); closeAccountMenu()"
                      class="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left text-sm font-medium text-slate-700 transition hover:bg-orange-50 hover:text-orange-500"
                    >
                      <span
                        class="flex h-9 w-9 items-center justify-center rounded-lg bg-orange-100 text-orange-500"
                      >
                        <i class="fa-solid fa-gauge-high"></i>
                      </span>

                      <span class="flex-1">
                        <span class="block font-semibold">Admin Panel</span>
                        <span class="block text-xs text-slate-400"> Manage PocketDuka </span>
                      </span>

                      <i class="fa-solid fa-chevron-right text-xs text-slate-300"></i>
                    </button>
                  }
                </div>

                <!-- Logout -->
                <div class="border-t border-slate-100 p-2">
                  <button
                    type="button"
                    (click)="logout()"
                    class="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left text-sm font-semibold text-red-500 transition hover:bg-red-50"
                  >
                    <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-red-50">
                      <i class="fa-solid fa-right-from-bracket"></i>
                    </span>

                    <span class="flex-1">
                      <span class="block">Logout</span>
                      <span class="block text-xs font-normal text-slate-400">
                        Sign out of your account
                      </span>
                    </span>
                  </button>
                </div>
              } @else {
                <!-- Logged Out -->
                <div class="p-5">
                  <div class="text-center">
                    <div
                      class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-orange-50 text-orange-500"
                    >
                      <i class="fa-regular fa-user text-xl"></i>
                    </div>

                    <h3 class="mt-3 text-base font-bold text-slate-900">Welcome to PocketDuka</h3>

                    <p class="mt-1 text-xs leading-5 text-slate-400">
                      Sign in to manage your account, orders and wishlist.
                    </p>
                  </div>

                  <div class="mt-5 space-y-2">
                    <!-- Login -->
                    <button
                      type="button"
                      (click)="navigateToLogin(); closeAccountMenu()"
                      class="flex w-full items-center justify-center gap-2 rounded-xl bg-orange-500 px-4 py-3 text-sm font-bold text-white transition hover:bg-orange-600"
                    >
                      <i class="fa-solid fa-right-to-bracket"></i>
                      Sign In
                    </button>

                    <!-- Sign Up -->
                    <button
                      type="button"
                      (click)="navigateToSignup(); closeAccountMenu()"
                      class="flex w-full items-center justify-center gap-2 rounded-xl border border-slate-200 px-4 py-3 text-sm font-bold text-slate-700 transition hover:border-orange-300 hover:bg-orange-50 hover:text-orange-500"
                    >
                      <i class="fa-solid fa-user-plus"></i>
                      Create Account
                    </button>
                  </div>
                </div>
              }
            </div>
          }
        </div>

        <!-- Wishlist -->
        <button
          type="button"
          (click)="navigateToWishlist()"
          class="flex h-10 w-10 items-center justify-center rounded-lg text-slate-600 transition hover:bg-orange-50 hover:text-orange-500"
          aria-label="Wishlist"
        >
          <i class="fa-regular fa-heart text-xl"></i>
        </button>

        <!-- Cart -->
        <button
          type="button"
          class="relative flex h-10 w-10 items-center justify-center rounded-lg text-slate-600 transition hover:bg-orange-50 hover:text-orange-500"
          aria-label="Shopping cart"
          (click)="navigateToCart()"
        >
          <i class="fa-solid fa-cart-shopping text-xl"></i>

          @if (cartService.cart().total_items! > 0) {
            <span
              class="absolute -right-1 -top-1 flex h-5 min-w-5 items-center justify-center rounded-full bg-orange-500 px-1 text-[10px] font-bold text-white"
            >
              {{ cartService.cart().total_items }}
            </span>
          }
        </button>

        <!-- Mobile Menu Button -->
        <button
          type="button"
          (click)="toggleMobileNav()"
          class="flex h-10 w-10 items-center justify-center rounded-lg text-slate-700 transition hover:bg-slate-100 md:hidden"
          aria-label="Toggle navigation"
        >
          @if (showMobileNav()) {
            <i class="fa-solid fa-xmark text-xl"></i>
          } @else {
            <i class="fa-solid fa-bars text-xl"></i>
          }
        </button>
      </div>
    </div>

    <!-- =====================================================
         MOBILE SEARCH
    ====================================================== -->

    <div class="pb-3 md:hidden">
      <div
        class="flex h-11 w-full items-center overflow-hidden rounded-xl border border-slate-200 bg-slate-50 focus-within:border-orange-400 focus-within:bg-white focus-within:ring-2 focus-within:ring-orange-100"
      >
        <input
          type="text"
          placeholder="Search products..."
          class="min-w-0 flex-1 border-0 bg-transparent px-4 text-sm text-slate-700 outline-none placeholder:text-slate-400"
        />

        <button
          type="button"
          class="flex h-full w-12 shrink-0 items-center justify-center bg-orange-500 text-white"
          aria-label="Search"
        >
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>
    </div>

    <!-- =====================================================
         DESKTOP CATEGORY NAVIGATION
    ====================================================== -->

    <nav class="hidden border-t border-slate-100 md:block">
      <div class="flex h-12 items-center justify-between">
        <div class="flex items-center gap-7 text-sm font-medium text-slate-600">
          <button
            type="button"
            (click)="navigateToProducts()"
            class="transition hover:text-orange-500"
          >
            Shop All
          </button>

          <button
            type="button"
            (click)="navigateToCategory('electronics')"
            class="transition hover:text-orange-500"
          >
            Electronics
          </button>

          <button
            type="button"
            (click)="navigateToCategory('fashion')"
            class="transition hover:text-orange-500"
          >
            Fashion
          </button>

          <button
            type="button"
            (click)="navigateToCategory('home-living')"
            class="transition hover:text-orange-500"
          >
            Home & Living
          </button>

          <button type="button" class="transition hover:text-orange-500">Beauty</button>

          <button
            type="button"
            class="flex items-center gap-1 font-semibold text-orange-500 transition hover:text-orange-600"
          >
            Deals
            <span class="rounded-full bg-orange-100 px-2 py-0.5 text-[9px] font-bold uppercase">
              Sale
            </span>
          </button>
        </div>

        <div class="flex items-center gap-2 text-xs text-slate-400">
          <i class="fa-solid fa-truck-fast text-orange-500"></i>
          <span>Fast & Reliable Delivery</span>
        </div>
      </div>
    </nav>
  </div>

  <!-- =======================================================
       MOBILE NAVIGATION
  ======================================================== -->

  @if (showMobileNav()) {
    <div class="border-t border-slate-200 bg-white shadow-lg md:hidden">
      <div class="mx-auto w-full max-w-7xl px-4 py-4 sm:px-6">
        <nav class="flex flex-col gap-1">
          <button
            type="button"
            (click)="navigateToProducts(); toggleMobileNav()"
            class="flex items-center gap-3 rounded-xl px-4 py-3 text-left font-medium text-slate-700 transition hover:bg-orange-50 hover:text-orange-500"
          >
            <i class="fa-solid fa-store w-5 text-center"></i>
            <span>Shop All</span>
          </button>

          <button
            type="button"
            (click)="navigateToCategory('electronics'); toggleMobileNav()"
            class="flex items-center gap-3 rounded-xl px-4 py-3 text-left font-medium text-slate-700 transition hover:bg-orange-50 hover:text-orange-500"
          >
            <i class="fa-solid fa-mobile-screen-button w-5 text-center"></i>
            <span>Electronics</span>
          </button>

          <button
            type="button"
            (click)="navigateToCategory('fashion'); toggleMobileNav()"
            class="flex items-center gap-3 rounded-xl px-4 py-3 text-left font-medium text-slate-700 transition hover:bg-orange-50 hover:text-orange-500"
          >
            <i class="fa-solid fa-shirt w-5 text-center"></i>
            <span>Fashion</span>
          </button>

          <button
            type="button"
            (click)="navigateToCategory('home-living'); toggleMobileNav()"
            class="flex items-center gap-3 rounded-xl px-4 py-3 text-left font-medium text-slate-700 transition hover:bg-orange-50 hover:text-orange-500"
          >
            <i class="fa-solid fa-house w-5 text-center"></i>
            <span>Home & Living</span>
          </button>

          <button
            type="button"
            class="flex items-center gap-3 rounded-xl px-4 py-3 text-left font-medium text-slate-700 transition hover:bg-orange-50 hover:text-orange-500"
          >
            <i class="fa-solid fa-wand-magic-sparkles w-5 text-center"></i>
            <span>Beauty</span>
          </button>

          <button
            type="button"
            class="flex items-center gap-3 rounded-xl bg-orange-50 px-4 py-3 text-left font-semibold text-orange-500 transition hover:bg-orange-100"
          >
            <i class="fa-solid fa-tags w-5 text-center"></i>
            <span>Deals & Offers</span>
          </button>
        </nav>

        <!-- Mobile Account -->
        <div class="mt-4 border-t border-slate-100 pt-4">
          <button
            type="button"
            class="flex w-full items-center gap-3 rounded-xl px-4 py-3 text-left text-slate-700 transition hover:bg-slate-50"
          >
            <i class="fa-regular fa-user w-5 text-center"></i>

            <div>
              <p class="text-sm font-semibold">My Account</p>
              <p class="text-xs text-slate-400">Sign in or create an account</p>
            </div>
          </button>
        </div>
      </div>
    </div>
  }
</header>
